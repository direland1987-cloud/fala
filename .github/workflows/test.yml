name: Tests
on:
  push:
    paths:
      ['public/**', 'tests/**', 'baseline/**', 'scripts/**', 'package.json', 'package-lock.json']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
