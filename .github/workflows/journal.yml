name: Render journal
on:
  push:
    branches: [main]
    paths: ['data/**']
permissions:
  contents: write
concurrency:
  group: journal
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/render-journal.mjs
      - name: Commit JOURNAL.md if it changed
        run: |
          if git diff --quiet -- JOURNAL.md; then echo "Journal unchanged"; exit 0; fi
          git config user.name "fala-journal[bot]"
          git config user.email "fala-journal@users.noreply.github.com"
          git add JOURNAL.md
          git commit -m "Render journal [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
